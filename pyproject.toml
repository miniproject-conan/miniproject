[tool.poetry]
name = "miniproject"
version = "0.1.0"
description = ""
authors = ["Minju <you@example.com>"]
#readme = "README.md"         # README 만들었으니 OK
package-mode = false          # 패키징 안 할 거면 편해요

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.12.0"
pydantic-settings = "^2.11.0"
python-dotenv = "^1.0.0"
tortoise-orm = "^0.25.1"
aiosqlite = "^0.21.0"
jinja2 = "^3.1.6"
asyncpg = "^0.30.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.aerich]
tortoise_orm = "app.db.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."