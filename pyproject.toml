[tool.poetry]
name = "miniproject"
version = "0.1.0"
description = ""
authors = ["ji-min0 <k.jimin2002@gmail.com>"]
#readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.118.0"
uvicorn = { extras = ["standard"], version = "^0.37.0" }
pydantic = "^2.12.0"
pydantic-settings = "^2.11.0"
python-dotenv = "^1.0.0"
tortoise-orm = "^0.25.1"
asyncpg = "^0.30.0"
jinja2 = "^3.1.6"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-jose = { extras = ["cryptography"], version = "^3.5.0" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
aiosqlite = "^0.21.0"   # 로컬 테스트 DB용
aerich = "^0.7.2"       # Tortoise ORM 마이그레이션 도구
black = "^24.10.0"
isort = "^5.13.2"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.aerich]
tortoise_orm = "app.db.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
