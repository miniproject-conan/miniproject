<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}My name is CONAN - DiARy{% endblock %}</title>
  <script>
    const savedTheme = localStorage.getItem("theme") || "pink";
    document.documentElement.style.setProperty("color-scheme", savedTheme === "black" ? "dark" : "light");
    document.addEventListener("DOMContentLoaded", () => {
      document.body.dataset.theme = savedTheme;
    });
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='style/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='style/diary.css') }}">
  <script src="https://kit.fontawesome.com/2271afb610.js" crossorigin="anonymous"></script>
</head>

<body>
<div class="stage">
  <div class="window">
    <!-- Top Title Bar -->
    <div class="titlebar">
      <div class="traffic"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div>My name is Conan, and I'm a detective.</div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <span id="userDisplay" style="font-weight:600;"></span>
      </div>
    </div>

    <div class="desk">
      <div class="notebook">
        <div class="band"><span class="diary_title" style="padding-left: 3em;">{{ username }}의 일기장</span></div>

        <div class="pages">
          <!-- Left Page (Diary list OR Diary read) -->
          <section class="page left">
            <div class="inner" id="leftPane">
              <div class="diary-area">
                {% if post %}
                {% include 'diary_read.html' %}
                {% else %}
                {% include 'diary_list.html' %}
                {% endif %}
              </div>
            </div>
          </section>

          <!-- Rings -->
          <div class="rings" aria-hidden="true">
            <span class="ring"></span>
            <span class="ring"></span>
            <span class="ring"></span>
          </div>

          <!-- Right Page (quotes + bookmark + diary button) -->
          <section class="page right">
            <div class="inner" id="rightPane">
              <div class="quote-area">
                {% include 'quote.html' %}
              </div>

              <br>

              <div class="bookmark-area">
                {% include 'bookmark.html' %}
              </div>

              <div class="diary-button-area">
                <input type="button" id="writeDiaryBtn" class="diary-btn" value="일기 쓰기"
                  onclick="window.location.href='{{ url_for('render_write') }}'">
              </div>
            </div>
          </section>

          <!-- Year / Month Navigation -->
          <aside class="righttabs">
            <select class="year-select" id="yearSelect">
              {% for y in range(2024, 2027) %}
              <option value="{{ y }}" {% if y== selected_year %}selected{% endif %}>{{ y }}</option>
              {% endfor %}
            </select>

            {% for month in range(1, 13) %}
            <button class="tab-btn" data-month-btn="{{ month }}" onclick="goToMonth({{ month }})">
              {{ month }}월
            </button>
            {% endfor %}
            <a href="/" class="tab-link">
              <button class="tab-btn" data-month-btn="all">전체</button>
            </a>
          </aside>
        </div>
      </div>

      <!-- Theme Buttons & Log Out -->
      <div class="theme-switcher">
        <button class="theme-btn" data-theme="pink">핑크톤</button>
        <button class="theme-btn" data-theme="blue">블루톤</button>
        <button class="theme-btn" data-theme="black">블랙톤</button>
        <button id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <div class="statusbar"></div>
  </div>
</div>

<!-- Scripts -->
<script src="{{ url_for('static', path='theme-manager.js') }}" defer></script>
<script src="{{ url_for('static', path='script.js') }}"></script>
<script src="{{ url_for('static', path='quote.js') }}"></script>
<script src="{{ url_for('static', path='bookmark.js') }}"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 로그인 체크
    async function checkLogin() {
      try {
        const res = await fetch("/api/v1/auth/me", {credentials: "include"});
        if (!res.ok) throw new Error();

        const user = await res.json();
        document.getElementById("userDisplay").textContent = `${user.username}님`;
      } catch {
        window.location.href = "/api/v1/auth/login";
      }
    }

    // 로그아웃
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        await fetch("/api/v1/auth/logout", {
          method: "POST",
          credentials: "include"
        });
      } catch {
      }

      alert("로그아웃 되었습니다.");
      window.location.href = "/api/v1/auth/login";
    });

    checkLogin();
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const yearSelect = document.getElementById("yearSelect");
    const buttons = document.querySelectorAll(".tab-btn");

    // 월 버튼 클릭 시 이동
    window.goToMonth = function (month) {
      const year = yearSelect.value;
      window.location.href = `/api/v1/diary/month?year=${year}&month=${month}`;
    };

    // 현재 URL 기준으로 활성화 버튼 표시
    const params = new URLSearchParams(window.location.search);
    const month = params.get("month");
    const buttonsArr = Array.from(buttons);
    buttonsArr.forEach(btn => btn.classList.remove("active"));

    let activeBtn;
    if (month) {
      activeBtn = document.querySelector(`[data-month-btn="${month}"]`);
    } else {
      // month 파라미터가 없는 경우 = 전체(/)로 들어온 경우
      activeBtn = document.querySelector(`[data-month-btn="all"]`);
    }

    if (activeBtn) activeBtn.classList.add("active");
  });
</script>
</body>
</html>
