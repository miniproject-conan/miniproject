<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>일기 작성 — My name is Conan</title>

  <link rel="stylesheet" href="{{ url_for('static', path='style/write.css') }}">
  <script src="{{ url_for('static', path='write.js') }}" defer></script>

  <script src="https://kit.fontawesome.com/2271afb610.js" crossorigin="anonymous"></script>
</head>
<body data-theme="pink">
  <div class="stage">
    <div class="window">
      <div class="titlebar">
        <div class="traffic"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <div>My name is Conan, and I'm a detective.</div>

        <!-- ✅ 로그인 유저 표시 -->
        <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
          <span id="userDisplay" style="font-weight:600;"></span>
        </div>
      </div>

      <div class="desk">
        <div class="notebook">
          <div class="band"><span class="diary_title">{{ user.username }}의 일기장</span></div>

          <div class="pages">
            <!-- ✅ 왼쪽 PAGE (일기 입력) -->
            <section class="page left">
              <div class="inner" id="leftPane">

                <div class="diary-container">
                    <div class="diary-header">오늘의 일기</div>

                    <div class="diary-field">
                        <label class="diary-label">제목</label>
                        <input id="diaryTitle" type="text" class="diary-input" placeholder="제목을 입력하세요.">
                    </div>

                    <div class="diary-field">
                        <label class="diary-label">내용</label>
                        <textarea id="diaryContent" class="diary-content-input" placeholder="오늘 어떤 일이 있었나요?"></textarea>
                    </div>
                </div>

              </div>
            </section>

            <div class="rings" aria-hidden="true">
              <span class="ring"></span><span class="ring"></span><span class="ring"></span>
            </div>

            <!-- ✅ 오른쪽 PAGE (질문 + 버튼) -->
            <section class="page right">
              <div class="inner" id="rightPane">

                <div class="question-container">
                  <div class="question-header">오늘의 질문</div>
                  <div class="question-field" id="dbQuestion">
                    당신이 오늘 가장 감사한 일은 무엇인가요?
                  </div>
                </div>

                <div class="question-answer-area">
                  <textarea id="questionAnswer" class="question-answer-input"
                            placeholder="답변을 입력하세요."></textarea>
                </div>

                <!-- ✅ 오른쪽 하단 버튼 영역 -->
                <div class="write-btn-wrapper">
                  <button id="saveDiaryBtn" class="upload-btn">저장하기</button>
                  <button id="backBtn" class="upload-btn back-btn">돌아가기</button>
                </div>

              </div>
            </section>

            <!-- ✅ 월/년 선택 -->
            <aside class="righttabs">
              <select class="year-select" id="yearSelect">
                <option value="2024">2024</option>
                <option value="2025" selected>2025</option>
                <option value="2026">2026</option>
              </select>
              {% for month in range(1, 13) %}
                <button class="tab-btn" data-month-btn="{{ month }}">{{ month }}월</button>
              {% endfor %}
            </aside>
          </div>
        </div>

        <!-- ✅ 테마 변경 + 로그아웃 -->
        <div class="theme-switcher">
          <button class="theme-btn" data-theme="pink">핑크톤</button>
          <button class="theme-btn" data-theme="blue">블루톤</button>
          <button class="theme-btn" data-theme="black">블랙톤</button>
          <button id="logoutBtn">로그아웃</button>
        </div>
      </div>

      <div class="statusbar"></div>
    </div>
  </div>

<!-- ✅ 로그인검증 + 저장/뒤로가기 + 로그아웃 -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  async function checkLogin() {
    try {
      const res = await fetch("/api/v1/auth/me", { credentials: "include" });
      if (!res.ok) throw new Error();
      const user = await res.json();
      document.getElementById("userDisplay").textContent = `${user.username}님`;
    } catch {
      window.location.href = "/api/v1/auth/login";
    }
  }

  checkLogin();

  const saveDiaryBtn = document.getElementById("saveDiaryBtn");
  const backBtn = document.getElementById("backBtn");

  saveDiaryBtn.addEventListener("click", async () => {
    const title = document.getElementById("diaryTitle").value.trim();
    const content = document.getElementById("diaryContent").value.trim();

    if (!title || !content) {
      alert("제목과 내용을 입력해주세요.");
      return;
    }

    const res = await fetch("/api/v1/diary/write", {
      method: "POST",
      credentials: "include",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ title, content })
    });

    if (res.ok) {
      alert("일기가 저장되었습니다!");
      window.location.href = "/";
    } else {
      alert("저장 실패! 다시 시도해주세요.");
    }
  });

  backBtn.addEventListener("click", () => {
    window.location.href = "/";
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try {
      await fetch("/api/v1/auth/logout", {
        method: "POST",
        credentials: "include"
      });
    } catch {}
    alert("로그아웃 되었습니다.");
    window.location.href = "/api/v1/auth/login";
  });
});
</script>

</body>
</html>
