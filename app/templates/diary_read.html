<div class="title_box">
  <div class="title_ment">제목 :</div>
  <div class="read_title">{{ post.title }}</div>
</div>

<div class="time_box">
  <div class="time_ment">날짜 :</div>
  <div class="read_time">{{ post.created_at.strftime('%Y-%m-%d') }}</div>
</div>

<div class="content_ment">내용</div>

<div class="content_box">
  <div class="read_content">{{ post.content }}</div>
</div>

<div class="btn_to_diary" style="margin-top:20px; display:flex; gap:10px;">
  <button class="back-btn" onclick="window.location.href='/'">← 목록</button>

  <!-- ✅ 수정 버튼 -->
  <button class="edit-btn" onclick="window.location.href='/api/v1/diary/edit/{{ post.id }}'">✏ 수정</button>
  <!-- ✅ 삭제 버튼 -->
  <button class="delete-btn" onclick="deleteDiary('{{ post.id }}')">🗑 삭제</button>
</div>

<script>
  // ✅ 삭제 기능
  async function deleteDiary(id) {
      if (!confirm("ㄹㅇ 삭제?")) return;

      const res = await fetch(`/api/v1/diary/${id}`, {
        method: "DELETE",
        credentials: "include"
      });

      if (res.ok) {
        alert("성공");
        window.location.href = "/";
      } else {
        alert("실패");
      }
    }

  // ✅ URL 파라미터로 접근 시 (기존 기능 유지)
  const params = new URLSearchParams(window.location.search);
  const date = params.get("date");
  const title = params.get("title");
  const content = params.get("content");

  if (title && date && content) {
    document.querySelector(".read_title").innerText = title;
    document.querySelector(".read_time").innerText = date;
    document.querySelector(".read_content").innerText = content;
  }
</script>
