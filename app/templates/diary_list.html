<div class="my-diary-list">
  {% if posts %}
  {% for diary in posts %}
  <div class="diary-items" onclick="window.location.href='/diary/read/{{ diary.id }}'">
    <div class="diary-date">{{ diary.created_at.strftime('%Y-%m-%d') }}</div>
    <div class="diary-title">{{ diary.title }}</div>
    <div class="diary-content">
      {{ diary.content[:40] }}{% if diary.content|length > 40 %}...{% endif %}
    </div>
  </div>
  {% endfor %}
  {% else %}
  <p>작성한 일기가 없습니다.</p>
  {% endif %}
</div>
