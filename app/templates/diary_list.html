  <div class="my-diary-list">
    {% for diary in posts %}
      <div class="diary-items" onclick="window.location.href='/api/v1/diary/read/{{ diary.id }}'">
        <div class="diary-date">{{ diary.created_at.strftime('%Y-%m-%d') }}</div>
        <div class="diary-title">{{ diary.title }}</div>
        <div class="diary-content">{{ diary.content[:40] }}...</div>
      </div>
    {% else %}
      <p>아직 작성한 일기가 없습니다.</p>
    {% endfor %}
  </div>


<script>
  /*---- diary_read.html 이동 ----*/
  document.querySelectorAll(".diary-items").forEach(item => {
    item.addEventListener("click", () => {
      const date = item.querySelector(".diary-date").innerText;
      const title = item.querySelector(".diary-title").innerText;
      const content = item.querySelector(".diary-content").innerText;

      const params = new URLSearchParams({
        date,
        title,
        content
      });
      window.location.href = `diary_read.html?${params.toString()}`;
    });
  });
</script>
